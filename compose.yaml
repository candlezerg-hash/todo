services:
  web:
    image: httpd:2.4
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/local/apache2/htdocs/index.html:ro
      - ./style.css:/usr/local/apache2/htdocs/style.css:ro
      - ./app.js:/usr/local/apache2/htdocs/app.js:ro
      - ./config.js:/usr/local/apache2/htdocs/config.js:ro
      - ./supabase/tasks-api.js:/usr/local/apache2/htdocs/supabase/tasks-api.js:ro
